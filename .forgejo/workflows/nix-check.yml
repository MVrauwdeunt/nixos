
name: NixOS configuration validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: nixos-ci
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check CI environment
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          node --version
          git --version

      - name: Validate Nix syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(git ls-files -z -- '*.nix')

      - name: Evaluate system configurations
        shell: bash
        run: |
          set -euo pipefail

          hosts=$(nix eval --raw \
            --apply 'hosts: builtins.concatStringsSep " " (builtins.attrNames hosts)' \
            .#nixosConfigurations)

          failed=0

          for host in $hosts; do
            echo "Checking $host"

            if nix eval --raw \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            then
              echo
              echo "PASS: $host"
            else
              echo "FAIL: $host"
              failed=1
            fi
          done

          exit "$failed"

      - name: Validate flake and deploy definitions
        shell: bash
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --show-trace

      - name: Validation complete
        run: echo "All NixOS configurations passed validation."


name: NixOS configuration validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: nixos-ci
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check CI environment
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          node --version
          git --version
          gitleaks version
          yq --version

      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir --redact .

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --log-opts="--all" .

      - name: Validate CI scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck ci/check-sops.sh
          shellcheck ci/check-impact.sh

      - name: Validate SOPS encryption and recipients
        shell: bash
        run: |
          set -euo pipefail
          bash ci/check-sops.sh

      - name: Validate Nix syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            nix-instantiate --parse "$file" >/dev/null
          done < <(git ls-files -z -- '*.nix')

      - name: Check Nix code quality with Statix
        shell: bash
        run: |
          set -euo pipefail
          statix check .

      - name: Check unused declarations with Deadnix
        shell: bash
        run: |
          set -euo pipefail
          deadnix --fail --no-lambda-pattern-names .

      - name: Evaluate systems and analyze infrastructure impact
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              ;;
            push)
              base="$PUSH_BASE"
              ;;
            *)
              base=$(git rev-parse HEAD^1)
              ;;
          esac

          head=$(git rev-parse HEAD)

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base revision is unavailable"
            exit 1
          fi

          bash ci/check-impact.sh "$base" "$head" |
            tee /tmp/infrastructure-impact.txt

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## Infrastructure Impact Report"
              echo
              echo '```text'
              cat /tmp/infrastructure-impact.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate flake and deploy definitions
        shell: bash
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --show-trace

      - name: Validation complete
        run: echo "All NixOS configurations passed validation."
